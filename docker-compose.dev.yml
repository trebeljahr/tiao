services:
  # RustFS: MinIO-compatible S3 server (MinIO no longer publishes images).
  # Console: http://localhost:9001/rustfs/console/ (minioadmin / minioadmin).
  s3:
    image: rustfs/rustfs:1.0.1
    restart: unless-stopped
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    environment:
      RUSTFS_ACCESS_KEY: minioadmin
      RUSTFS_SECRET_KEY: minioadmin
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
    volumes:
      - s3-data:/data

  s3-init:
    image: amazon/aws-cli:2.37.9
    depends_on:
      - s3
    restart: "no"
    volumes:
      - ./scripts/init-s3-bucket.sh:/init-s3-bucket.sh:ro
    entrypoint: ["sh", "/init-s3-bucket.sh", "http://s3:9000", "tiao-dev"]

  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo-data:/data/db

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  s3-data:
  mongo-data:
