apply plugin: 'com.android.application'

// CI supplies the complete signing set through environment variables.
// Local release builds can use the ignored keystore.properties file.
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("keystore.properties")
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}
def signingEnv = [
    storeFile: 'ANDROID_KEYSTORE_PATH',
    storePassword: 'ANDROID_KEYSTORE_PASSWORD',
    keyAlias: 'ANDROID_KEY_ALIAS',
    keyPassword: 'ANDROID_KEY_PASSWORD'
]
if (signingEnv.values().any { System.getenv(it) }) {
    keystoreProperties.clear()
    signingEnv.each { key, env -> keystoreProperties[key] = System.getenv(env) ?: '' }
}
def hasReleaseKeystore = signingEnv.keySet().every { keystoreProperties[it] }
def packageVersion = new groovy.json.JsonSlurper().parse(rootProject.file('../package.json')).version
def releaseBuildNumber = System.getenv('RELEASE_BUILD_NUMBER')
if (releaseBuildNumber && (!(releaseBuildNumber ==~ /[1-9][0-9]*/) || releaseBuildNumber.toLong() > 2100000000)) {
    throw new GradleException('RELEASE_BUILD_NUMBER must be an integer from 1 to 2100000000.')
}
gradle.taskGraph.whenReady { graph ->
    if (graph.allTasks.any { it.project == project && it.name.toLowerCase().contains('release') }) {
        if (!releaseBuildNumber) throw new GradleException('Set RELEASE_BUILD_NUMBER above the highest Play version code before a release build.')
        if (!hasReleaseKeystore || !file(keystoreProperties['storeFile']).isFile()) {
            throw new GradleException('Release signing is required. Set the complete ANDROID_KEYSTORE_* / ANDROID_KEY_* environment or keystore.properties.')
        }
    }
}

android {
    namespace = "com.ricoslabs.tiao"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.ricoslabs.tiao"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode releaseBuildNumber ? releaseBuildNumber.toInteger() : 1
        versionName packageVersion
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    if (hasReleaseKeystore) {
        signingConfigs {
            release {
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
            }
        }
    }
    buildTypes {
        release {
            // R8 with minifyEnabled true shrinks + obfuscates the app,
            // which is required for a reasonable final APK size (~30%
            // smaller) and for Play Store's optimized delivery. Proguard
            // rules below exclude the Capacitor bridge from obfuscation
            // so JS can still call into native plugins at runtime.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasReleaseKeystore) {
                signingConfig signingConfigs.release
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
