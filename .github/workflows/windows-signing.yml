name: windows-signing

# Artifact-only verification. No tags, releases, stores, or deployment writes.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tiao-windows-signing
  cancel-in-progress: false

jobs:
  signed-build:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: |
            client/pnpm-lock.yaml
            desktop/pnpm-lock.yaml

      - name: Install build dependencies
        run: |
          pnpm --dir client install --frozen-lockfile
          pnpm --dir desktop install --frozen-lockfile

      - name: Build desktop client
        run: pnpm --dir client exec next build --webpack
        env:
          NEXT_PUBLIC_PLATFORM: desktop
          NEXT_PUBLIC_DESKTOP_API_URL: https://api.playtiao.com

      - name: Stage client bundle
        shell: pwsh
        run: Copy-Item -Recurse client/.next-desktop desktop/client-bundle

      - name: Install pinned signing module
        shell: pwsh
        run: Install-Module ArtifactSigning -RequiredVersion 0.1.20 -Repository PSGallery -Scope CurrentUser -Force

      - name: Azure login with repository OIDC
        uses: azure/login@8216e11d8cd9b42fe925c852af8e76311ff067ac # v2
        with:
          client-id: 3b02aa37-f2ac-45aa-a6c2-112f54f2c189
          tenant-id: ce0c906e-8a84-4877-afd9-cdf103ddaacb
          subscription-id: 4aaef5a5-286b-46a0-b9e4-84622e8fdc4f

      - name: Package and sign Windows binaries
        run: pnpm --dir desktop exec electron-builder --win --x64 --config electron-builder.windows-signing.cjs --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          TIAO_DESKTOP_VERSION: ${{ github.sha }}
          TIAO_API_URL: https://api.playtiao.com

      - name: Verify application, installers, and installed uninstaller
        shell: pwsh
        run: ./desktop/scripts/verify-windows-signatures.ps1

      - name: Upload verified binaries and signature evidence
        uses: actions/upload-artifact@v4
        with:
          name: tiao-windows-signed-${{ github.sha }}
          path: |
            desktop/dist/*.exe
            desktop/dist/*.yml
            desktop/dist/*.blockmap
            desktop/dist/windows-signatures.json
          if-no-files-found: error
          retention-days: 14
