name: tests

on:
  push:
    branches:
      - main
    # Skip the whole workflow when only obviously-non-code paths
    # changed. AND-based: if ANY non-ignored path also changed, the
    # workflow still runs. Saves ~12 min of CI on pure-docs / README /
    # husky pushes.
    #
    # `desktop/**` is deliberately NOT ignored. It used to be, which
    # meant a push touching only desktop/src/steam.cjs ran no tests at
    # all — including that file's own suite. The e2e job stays skipped
    # for desktop-only diffs anyway, since nothing in `e2e_affected`
    # matches them, so the cost of running is the unit job rather than
    # the full ~12 minutes.
    paths-ignore:
      - "docs/**"
      - "docs-site/**"
      - "**.md"
      - ".husky/**"

permissions:
  contents: read

jobs:
  # Lightweight pre-flight that computes booleans for the rest of the
  # workflow. Lets us skip the e2e job (~10 min) when the diff doesn't
  # touch anything e2e actually exercises — server/tests-only pushes,
  # client unit-test-only pushes, isolated workflow tweaks for non-tests
  # workflows, etc.
  changes:
    runs-on: ubuntu-latest
    outputs:
      e2e_affected: ${{ steps.filter.outputs.e2e_affected }}
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Compute changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          # micromatch syntax. `!` excludes. Filter is "affected" if any
          # included path changed AND no rule explicitly bumps it back
          # to safe. Conservative — if in doubt about a path, leave it
          # out of the ignore set so e2e still runs.
          filters: |
            e2e_affected:
              - 'client/src/**'
              - '!client/src/**/*.test.*'
              - 'client/next.config.*'
              - 'client/server.mjs'
              - 'client/package*.json'
              - 'server/**'
              - '!server/tests/**'
              - 'shared/**'
              - 'e2e/**'
              - 'playwright.config.ts'
              - 'package*.json'
              - '.github/workflows/tests.yml'

  unit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            client/pnpm-lock.yaml
            server/pnpm-lock.yaml

      - name: Install dependencies
        env:
          SKIP_DESKTOP: "1"
        run: pnpm install --frozen-lockfile

      - name: Build repo
        run: pnpm run build

      - name: Run unit tests
        run: pnpm run test:unit

      - name: Install gitleaks
        # Pinned release binary with checksum, ~2s. gitleaks-action would
        # need a licence key for org repos; the tarball does not.
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          curl -sSfL -o /tmp/gitleaks.tgz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tgz" | sha256sum -c -
          mkdir -p "$HOME/.local/bin"
          tar -xzf /tmp/gitleaks.tgz -C "$HOME/.local/bin" gitleaks
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Scan working tree for secrets
        # Working tree only (no history) — fails the job on any finding
        # not allowlisted in .gitleaks.toml.
        run: pnpm run scan:secrets

      - name: Validate Steam achievement API names
        # Cheap, and the failure it catches is otherwise invisible:
        # Steam silently discards unlock calls for API names it doesn't
        # recognise, so a malformed name breaks an achievement with no
        # error anywhere. Runs here rather than only in the Steam
        # release lane so a bad name is caught when it's introduced.
        run: pnpm run steam:achievements:check

  integration:
    runs-on: ubuntu-latest
    services:
      redis-integration:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            server/pnpm-lock.yaml

      - name: Install dependencies
        env:
          SKIP_DESKTOP: "1"
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Install server dependencies
        run: pnpm --dir server install --frozen-lockfile

      - name: Run integration tests
        run: pnpm run test:integration

  e2e:
    runs-on: ubuntu-latest
    # Skip e2e when nothing it can observe changed. unit + integration
    # always run regardless — they're cheap (~100s + ~75s) and we don't
    # want test-related changes to silently get zero CI coverage. This
    # filter only gates the ~10-min e2e job.
    needs: changes
    if: needs.changes.outputs.e2e_affected == 'true'
    services:
      mongo-e2e:
        image: mongo:7
        ports:
          - 27018:27017
      redis-e2e:
        image: redis:7-alpine
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            client/pnpm-lock.yaml
            server/pnpm-lock.yaml

      - name: Install dependencies
        env:
          SKIP_DESKTOP: "1"
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Start MinIO and install Playwright (parallel)
        run: |
          # Start MinIO in background
          docker run -d --name tiao-e2e-minio \
            -p 9002:9000 \
            -e MINIO_ROOT_USER=minioadmin \
            -e MINIO_ROOT_PASSWORD=minioadmin \
            --tmpfs /data \
            minio/minio:latest server /data

          # Install Playwright while MinIO starts
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" != "true" ]; then
            pnpm exec playwright install --with-deps chromium
          else
            pnpm exec playwright install-deps chromium
          fi

          # Now initialize MinIO bucket (should be ready by now)
          for i in $(seq 1 15); do
            if curl -sf http://127.0.0.1:9002/minio/health/live; then break; fi
            sleep 1
          done
          curl -sSfL https://dl.min.io/client/mc/release/linux-amd64/mc -o /tmp/mc && chmod +x /tmp/mc
          /tmp/mc alias set ci http://127.0.0.1:9002 minioadmin minioadmin
          /tmp/mc mb --ignore-existing ci/tiao-e2e
          /tmp/mc anonymous set download ci/tiao-e2e

      - name: Run e2e tests
        # `test:e2e` builds the client once then runs playwright; playwright's
        # webServer starts the prebuilt prod server once for the whole suite
        # and all tests (both workers) share it. No per-test rebuild.
        run: pnpm run test:e2e
        env:
          CI: "true"
          MONGODB_URI: mongodb://127.0.0.1:27018/tiao-e2e
          TOKEN_SECRET: e2e-secret
