# Dependency autopilot: lands the branches that Claude on the hq box pushes.
# The box scans GitHub's main every morning, a Claude session applies the
# updates on deps/<date> and pushes the branch. This workflow runs the repo's
# checks on it, then fast-forwards main (never a merge, never a force push) and
# starts build-and-deploy, because a push made with GITHUB_TOKEN starts no push
# workflows. When main moved meanwhile it rebases onto main, pushes the result
# as a new deps/ branch and runs itself again on it, so nothing lands untested.
# deps/<date>-major branches only run the checks; they land when Rico says so
# (hq: `deps-state land <repo> <date>`, which dispatches this with land=true).
# No pull requests. The box reads the outcome from this workflow's runs.
name: deps-land
run-name: deps-land ${{ inputs.branch || github.ref_name }}

on:
  push:
    branches: ["deps/**"]
  workflow_dispatch:
    inputs:
      branch:
        description: deps/ branch to check (and land)
        required: true
      land:
        description: land it after the checks
        type: boolean
        default: true

concurrency:
  group: deps-land-${{ inputs.branch || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  target:
    runs-on: ubuntu-latest
    outputs:
      branch: ${{ steps.t.outputs.branch }}
      sha: ${{ steps.t.outputs.sha }}
      land: ${{ steps.t.outputs.land }}
    steps:
      - id: t
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          IN_BRANCH: ${{ inputs.branch }}
          IN_LAND: ${{ inputs.land }}
          REF_NAME: ${{ github.ref_name }}
          PUSH_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = push ]; then
            branch=$REF_NAME; sha=$PUSH_SHA
            case "$branch" in *-major) land=false ;; *) land=true ;; esac
          else
            branch=$IN_BRANCH; land=$IN_LAND
            sha=$(gh api "repos/$REPO/git/ref/heads/$branch" --jq .object.sha)
          fi
          case "$branch" in deps/*) ;; *) echo "only deps/ branches"; exit 1 ;; esac
          { echo "branch=$branch"; echo "sha=$sha"; echo "land=$land"; } >> "$GITHUB_OUTPUT"
          echo "$branch at $sha, land=$land"

  # Checks: the same jobs dependency-updates.yml runs on Dependabot PRs.
  unit:
    needs: [target]
    runs-on: ubuntu-latest
    steps:
      - name: Check out the branch
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.target.outputs.sha }}
          persist-credentials: false

      - uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            client/pnpm-lock.yaml
            server/pnpm-lock.yaml

      - name: Install dependencies
        env:
          SKIP_DESKTOP: "1"
        run: pnpm install --frozen-lockfile

      - name: Build repo
        run: pnpm run build

      - name: Run unit tests
        run: pnpm run test:unit

      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          curl -sSfL -o /tmp/gitleaks.tgz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tgz" | sha256sum -c -
          mkdir -p "$HOME/.local/bin"
          tar -xzf /tmp/gitleaks.tgz -C "$HOME/.local/bin" gitleaks
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Scan working tree for secrets
        run: pnpm run scan:secrets

      - name: Validate Steam achievement API names
        run: pnpm run steam:achievements:check

  integration:
    needs: [target]
    runs-on: ubuntu-latest
    services:
      mongo-integration:
        image: mongo:7.0.45
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'quit(db.adminCommand({ping:1}).ok ? 0 : 1)'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis-integration:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Check out the branch
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.target.outputs.sha }}
          persist-credentials: false

      - uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            server/pnpm-lock.yaml

      - name: Install dependencies
        env:
          SKIP_DESKTOP: "1"
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Install server dependencies
        run: pnpm --dir server install --frozen-lockfile

      - name: Run integration tests
        run: pnpm run test:integration
        env:
          MONGODB_TEST_URI: mongodb://127.0.0.1:27017

  e2e:
    needs: [target]
    runs-on: ubuntu-latest
    services:
      mongo-e2e:
        image: mongo:7
        ports:
          - 27018:27017
      redis-e2e:
        image: redis:7-alpine
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Check out the branch
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.target.outputs.sha }}
          persist-credentials: false

      - uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            client/pnpm-lock.yaml
            server/pnpm-lock.yaml

      - name: Install dependencies
        env:
          SKIP_DESKTOP: "1"
        run: pnpm install --frozen-lockfile

      - name: Use Ubuntu's own mirror when Azure's does not resolve
        # GitHub's runners list azure.archive.ubuntu.com first in apt's mirror file, and
        # apt does not move to the next mirror when a name fails to resolve. During an
        # Azure DNS outage (2026-11-11, hours) every package download failed.
        if: runner.os == 'Linux'
        run: |
          if ! getent hosts azure.archive.ubuntu.com >/dev/null && [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i '/azure\.archive\.ubuntu\.com/d' /etc/apt/apt-mirrors.txt
            echo "azure.archive.ubuntu.com does not resolve; apt uses the next mirror"
          fi
      - name: Start S3 storage and install Playwright
        run: |
          docker run -d --name tiao-e2e-s3 \
            -p 9002:9000 \
            -e RUSTFS_ACCESS_KEY=minioadmin \
            -e RUSTFS_SECRET_KEY=minioadmin \
            --tmpfs /data:mode=1777 \
            rustfs/rustfs:1.0.1

          pnpm exec playwright install --with-deps chromium

          for _ in $(seq 1 15); do
            if curl -sf http://127.0.0.1:9002/health; then break; fi
            sleep 1
          done
          bash scripts/init-s3-bucket.sh http://127.0.0.1:9002 tiao-e2e

      - name: Run e2e tests
        run: pnpm run test:e2e
        env:
          CI: "true"
          MONGODB_URI: mongodb://127.0.0.1:27018/tiao-e2e
          TOKEN_SECRET: e2e-secret

  land:
    needs: [target, unit, integration, e2e]
    if: needs.target.outputs.land == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - name: Fast-forward main, or rebase and test again
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ needs.target.outputs.branch }}
          SHA: ${{ needs.target.outputs.sha }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch -q origin main "+refs/heads/$BRANCH:refs/remotes/origin/$BRANCH"
          if [ "$(git rev-parse "origin/$BRANCH")" != "$SHA" ]; then
            echo "$BRANCH moved after the checks; the run for the new tip lands it"; exit 0
          fi
          if git merge-base --is-ancestor origin/main "$SHA"; then
            # Plain push: GitHub refuses it unless it is a fast-forward.
            git push origin "$SHA:refs/heads/main"
            echo "main -> $SHA"
            gh workflow run build-and-deploy.yml --ref main
            git push -q origin --delete "$BRANCH" || true
            exit 0
          fi
          base=${BRANCH%-rebased*}
          n=$(( $(git ls-remote --heads origin "$base-rebased*" | wc -l) + 1 ))
          next="$base-rebased$n"
          git checkout -q -B land "$SHA"
          if ! git rebase -q origin/main; then
            git rebase --abort || true
            echo "::error::$BRANCH does not rebase onto main cleanly"; exit 1
          fi
          git push -q origin "HEAD:refs/heads/$next"
          gh workflow run deps-land.yml --ref main -f branch="$next" -f land=true
          git push -q origin --delete "$BRANCH" || true
          echo "main moved: rebased onto $(git rev-parse --short origin/main) as $next, checks run again"
