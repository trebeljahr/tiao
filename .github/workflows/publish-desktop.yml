name: Publish tested desktop build

# Uploads the exact bytes of one successful signed "Build desktop binaries"
# run. It never rebuilds: prepare-publish.mjs checks the run (main, dispatch,
# success), the signed build provenance and every file hash first.
# See docs/RELEASING-desktop.md for environments, secrets and variables.

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful signed Build desktop binaries run ID
        type: string
        required: true
      destination:
        description: Upload destination
        type: choice
        options: [downloads-draft, itch, steam, mas, msstore]
        default: downloads-draft
      steam_branch:
        description: Steam beta branch to set live; empty uses the STEAM_DEFAULT_BRANCH variable (upload only if unset); "-" uploads only
        type: string
        default: ""

permissions:
  contents: read
  actions: read
  attestations: read

concurrency:
  group: tiao-desktop-publish-${{ inputs.destination }}
  cancel-in-progress: false

jobs:
  publish:
    if: inputs.destination != 'mas'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    environment: release-${{ inputs.destination }}
    permissions:
      contents: write
      actions: read
      attestations: read
    env:
      GH_TOKEN: ${{ github.token }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - name: Download and verify the signed source run
        env:
          SOURCE_RUN: ${{ inputs.run_id }}
          DESTINATION: ${{ inputs.destination }}
        run: node scripts/release/prepare-publish.mjs "$DESTINATION" "$SOURCE_RUN"

      - name: Create a draft download release
        if: inputs.destination == 'downloads-draft'
        run: node scripts/release/publish-desktop.mjs downloads-draft

      - name: Install butler
        if: inputs.destination == 'itch'
        run: |
          mkdir -p "$RUNNER_TEMP/butler"
          curl --fail --location --retry 3 https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default -o "$RUNNER_TEMP/butler.zip"
          unzip -q "$RUNNER_TEMP/butler.zip" -d "$RUNNER_TEMP/butler"
          chmod +x "$RUNNER_TEMP/butler/butler"
      - name: Upload itch builds
        if: inputs.destination == 'itch'
        env:
          BUTLER_PATH: ${{ runner.temp }}/butler/butler
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
          ITCH_USER: ${{ vars.ITCH_USER }}
          ITCH_GAME: ${{ vars.ITCH_GAME }}
        run: node scripts/release/publish-desktop.mjs itch

      - name: Prepare Steam depots
        if: inputs.destination == 'steam'
        env:
          STEAM_USERNAME: ${{ secrets.STEAM_USERNAME }}
          STEAM_CONFIG_VDF: ${{ secrets.STEAM_CONFIG_VDF }}
          STEAM_DEPOT_WINDOWS: ${{ vars.STEAM_DEPOT_WINDOWS }}
          STEAM_DEPOT_LINUX: ${{ vars.STEAM_DEPOT_LINUX }}
          STEAM_DEPOT_MACOS: ${{ vars.STEAM_DEPOT_MACOS }}
          STEAM_BRANCH: ${{ inputs.steam_branch }}
          STEAM_DEFAULT_BRANCH: ${{ vars.STEAM_DEFAULT_BRANCH }}
        run: node scripts/release/publish-desktop.mjs steam
      - name: Install SteamCMD runtime
        if: inputs.destination == 'steam'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y lib32gcc-s1
      - name: Upload Steam depots
        if: inputs.destination == 'steam'
        env:
          STEAM_USERNAME: ${{ secrets.STEAM_USERNAME }}
          STEAM_CONFIG_VDF: ${{ secrets.STEAM_CONFIG_VDF }}
        run: bash scripts/release/upload-steam.sh

      - name: Locate the Microsoft Store package
        id: msstore
        if: inputs.destination == 'msstore'
        env:
          MSSTORE_TENANT_ID: ${{ secrets.MSSTORE_TENANT_ID }}
          MSSTORE_CLIENT_ID: ${{ secrets.MSSTORE_CLIENT_ID }}
          MSSTORE_CLIENT_SECRET: ${{ secrets.MSSTORE_CLIENT_SECRET }}
          MSSTORE_SELLER_ID: ${{ secrets.MSSTORE_SELLER_ID }}
          MSSTORE_PRODUCT_ID: ${{ vars.MSSTORE_PRODUCT_ID }}
        run: |
          node scripts/release/publish-desktop.mjs msstore
          # All-or-none: unset means "upload the AppX by hand", partial is an error.
          submit=$(node --input-type=module -e "import { optionalCredentials } from './scripts/release/lib.mjs'; console.log(optionalCredentials('msstore-submission', process.env))")
          echo "submit=$submit" >> "$GITHUB_OUTPUT"
          if [ "$submit" != true ]; then
            echo "::notice::Partner Center API credentials are not set. Upload the verified AppX from the build run in Partner Center."
          fi
      - name: Set up the Microsoft Store Developer CLI
        if: inputs.destination == 'msstore' && steps.msstore.outputs.submit == 'true'
        uses: microsoft/microsoft-store-apppublisher@v1.1
      - name: Create a draft Microsoft Store submission
        if: inputs.destination == 'msstore' && steps.msstore.outputs.submit == 'true'
        env:
          MSSTORE_TENANT_ID: ${{ secrets.MSSTORE_TENANT_ID }}
          MSSTORE_CLIENT_ID: ${{ secrets.MSSTORE_CLIENT_ID }}
          MSSTORE_CLIENT_SECRET: ${{ secrets.MSSTORE_CLIENT_SECRET }}
          MSSTORE_SELLER_ID: ${{ secrets.MSSTORE_SELLER_ID }}
          MSSTORE_PRODUCT_ID: ${{ vars.MSSTORE_PRODUCT_ID }}
          PACKAGE: ${{ steps.msstore.outputs.package }}
        run: |
          msstore reconfigure --tenantId "$MSSTORE_TENANT_ID" --sellerId "$MSSTORE_SELLER_ID" \
            --clientId "$MSSTORE_CLIENT_ID" --clientSecret "$MSSTORE_CLIENT_SECRET"
          # --noCommit keeps the submission a draft; certification starts in Partner Center.
          msstore publish "$(dirname "$PACKAGE")" --inputFile "$PACKAGE" --appId "$MSSTORE_PRODUCT_ID" --noCommit

  publish-mas:
    if: inputs.destination == 'mas'
    runs-on: macos-15
    timeout-minutes: 40
    environment: release-mas
    permissions:
      contents: read
      actions: read
      attestations: read
    env:
      GH_TOKEN: ${{ github.token }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - name: Download and verify the signed source run
        env:
          SOURCE_RUN: ${{ inputs.run_id }}
        run: node scripts/release/prepare-publish.mjs mas "$SOURCE_RUN"
      - name: Locate the pkg
        id: mas
        run: node scripts/release/publish-desktop.mjs mas
      - name: Check App Store Connect configuration
        env:
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: node scripts/release/plan.mjs credentials appstore
      - name: Upload to App Store Connect
        env:
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          PACKAGE: ${{ steps.mas.outputs.package }}
        run: |
          umask 077
          export API_PRIVATE_KEYS_DIR="$RUNNER_TEMP/private_keys"
          mkdir -p "$API_PRIVATE_KEYS_DIR"
          printf '%s' "$APPLE_API_KEY_BASE64" | base64 --decode > "$API_PRIVATE_KEYS_DIR/AuthKey_$APPLE_API_KEY_ID.p8"
          trap 'rm -rf "$API_PRIVATE_KEYS_DIR"' EXIT
          pkgutil --check-signature "$PACKAGE"
          xcrun altool --upload-app -t macos -f "$PACKAGE" --apiKey "$APPLE_API_KEY_ID" --apiIssuer "$APPLE_API_ISSUER_ID"
