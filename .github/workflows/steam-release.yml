name: steam-release

# Builds the Steam variant of the Tiao desktop app on all three
# platforms and uploads each as a SteamPipe depot.
#
# Kept separate from `desktop-release.yml` on purpose. That workflow
# produces the itch.io / direct-download artifacts: signed installers,
# auto-updater enabled, published to GitHub Releases. A Steam build is
# a genuinely different artifact — the Steam gate baked in, the
# auto-updater hard-disabled, depots made of unpacked directories
# rather than installers — and conflating the two invites shipping an
# installer that fights Steam over its own files.
#
# Triggered by:
#   - `workflow_dispatch` (manual)
#   - `push: tags: steam-v*`
#
# Requires these repository secrets, none of which exist until the
# Partner Portal entry does:
#   TIAO_STEAM_APPID     — real appid (the job fails fast on 480)
#   STEAM_USERNAME       — build account with publish rights
#   STEAM_CONFIG_VDF     — base64 config.vdf from a 2FA'd steamcmd login
# See desktop/steam/README.md for how to produce STEAM_CONFIG_VDF.

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Steam branch to set live (blank = upload only, promote manually)"
        required: false
        default: ""
        type: string
      preview:
        description: "Dry run — report what would upload without transferring"
        required: false
        default: "false"
        type: choice
        options:
          - "true"
          - "false"
  push:
    tags:
      - "steam-v*"

concurrency:
  group: tiao-steam-release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Fail before burning three platform builds if the appid is missing
  # or still pointed at Valve's Spacewar test app.
  preflight:
    name: Preflight
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Verify Steam appid is real
        env:
          TIAO_STEAM_APPID: ${{ secrets.TIAO_STEAM_APPID }}
        run: |
          if [ -z "$TIAO_STEAM_APPID" ]; then
            echo "::error::TIAO_STEAM_APPID secret is not set."
            exit 1
          fi
          if [ "$TIAO_STEAM_APPID" = "480" ]; then
            echo "::error::TIAO_STEAM_APPID is 480 (Valve's Spacewar test app)."
            exit 1
          fi

      - name: Validate achievement API names
        # A mismatch between these and the Partner Portal produces no
        # error at runtime — Steam discards unlock calls for names it
        # does not know. Catching malformed names here is the only
        # automated check available.
        run: node scripts/steam-achievements.mjs --check

  build:
    name: Build ${{ matrix.name }}
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macOS (universal)
            content_path: desktop/dist/mac-universal/Tiao.app
            artifact: steam-mac
          - os: windows-latest
            name: Windows (x64)
            content_path: desktop/dist/win-unpacked
            artifact: steam-windows
          - os: ubuntu-latest
            name: Linux (x64)
            content_path: desktop/dist/linux-unpacked
            artifact: steam-linux
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            client/pnpm-lock.yaml
            server/pnpm-lock.yaml
            desktop/pnpm-lock.yaml

      - name: Install root + all workspaces (incl. desktop)
        run: pnpm install

      - name: Build static export for desktop
        run: pnpm --dir client run build:desktop
        env:
          NEXT_PUBLIC_PLATFORM: desktop
          NEXT_PUBLIC_DESKTOP_API_URL: https://api.playtiao.com

      - name: Stage client bundle into desktop/
        run: pnpm --dir desktop run dev:build-client

      - name: Package Steam variant
        # package:steam bakes steamBuild + steamAppId into the packaged
        # package.json. Without it the shipped binary has Steam off —
        # env vars do not survive packaging.
        run: pnpm --dir desktop run package:steam
        env:
          TIAO_STEAM_APPID: ${{ secrets.TIAO_STEAM_APPID }}
          TIAO_DESKTOP_VERSION: ${{ github.ref_name }}
          TIAO_API_URL: https://api.playtiao.com
          TIAO_OPENPANEL_API_URL: https://analytics-api.trebeljahr.com
          TIAO_OPENPANEL_CLIENT_ID: ${{ secrets.OPENPANEL_DESKTOP_CLIENT_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}

      - name: Verify the Steam flag actually got baked in
        # The failure this guards against is silent: a build with the
        # flag missing runs fine and simply never talks to Steam.
        shell: bash
        run: |
          set -euo pipefail
          asar_path="$(find desktop/dist -name app.asar -print -quit)"
          if [ -z "$asar_path" ]; then
            echo "::error::No app.asar found under desktop/dist"
            exit 1
          fi
          meta="$(npx asar extract-file "$asar_path" package.json)"
          echo "$meta" | grep -q '"steamBuild"' || {
            echo "::error::steamBuild missing from packaged package.json"
            exit 1
          }
          echo "$meta" | grep -o '"steam[^,]*' || true

      - name: Upload depot content as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.content_path }}
          if-no-files-found: error
          retention-days: 7

  upload:
    name: SteamPipe upload
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Download all platform builds
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Restore the depot directory layout
        # steam-upload.sh looks for the same paths electron-builder
        # produces, so put the downloaded artifacts back where a local
        # three-platform build would have left them.
        run: |
          set -euo pipefail
          mkdir -p desktop/dist/mac-universal
          mv artifacts/steam-mac desktop/dist/mac-universal/Tiao.app
          mv artifacts/steam-windows desktop/dist/win-unpacked
          mv artifacts/steam-linux desktop/dist/linux-unpacked
          # upload-artifact does not preserve the executable bit.
          chmod +x desktop/dist/linux-unpacked/tiao || true
          find desktop/dist/mac-universal/Tiao.app/Contents/MacOS -type f -exec chmod +x {} +

      - name: Install steamcmd
        run: |
          sudo add-apt-repository -y multiverse
          sudo dpkg --add-architecture i386
          sudo apt-get update
          echo steam steam/question select "I AGREE" | sudo debconf-set-selections
          echo steam steam/license note '' | sudo debconf-set-selections
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y steamcmd
          sudo ln -sf /usr/games/steamcmd /usr/local/bin/steamcmd

      - name: Upload to Steam
        env:
          TIAO_STEAM_APPID: ${{ secrets.TIAO_STEAM_APPID }}
          STEAM_USERNAME: ${{ secrets.STEAM_USERNAME }}
          STEAM_CONFIG_VDF: ${{ secrets.STEAM_CONFIG_VDF }}
          TIAO_DESKTOP_VERSION: ${{ github.ref_name }}
          # Defaults to empty: upload the build but leave every branch
          # untouched, so a human promotes it after smoke-testing.
          TIAO_STEAM_BRANCH: ${{ inputs.branch || '' }}
        run: |
          cd desktop
          if [ "${{ inputs.preview }}" = "true" ]; then
            ./scripts/steam-upload.sh --preview
          else
            ./scripts/steam-upload.sh
          fi
